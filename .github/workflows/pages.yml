# KeiView and the in-browser KeiPilot demo on GitHub Pages: https://<owner>.github.io/<repo>/?pilot=1 (one camera)
# and ?pilot=mc (KeiPilot Mc, two cameras). The site is web/ as it is (no build step); the driving models
# (keipilot.onnx and keipilot_mc.onnx, 30 MB each) are taken from the releases rather than from git, each from the
# newest release that has it. keipilot_mc_depth.onnx (KeiPilot Mc with ReconView's depth head, for ?pilot=mc&recon=model:
# docs/recon_view.md) is an experiment's model and may be in a pre-release; without it the site has no ?recon=model.
# reconfill_gen.onnx (ReconFill's fill model, for &fill=model: docs/recon_fill.md) likewise; without it &fill=model
# draws no fill.
# One-time setup: Settings -> Pages -> Source: GitHub Actions. After publishing a release with a new model, run this
# workflow by hand (gh workflow run pages.yml --ref main).
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Driving models from the releases
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() {   # fetch FILE [pre]: from the newest release that has it (pre-releases only with "pre")
            local pre=--exclude-pre-releases
            if [ "${2:-}" = pre ]; then pre=; fi
            for tag in $(gh release list --repo "$GITHUB_REPOSITORY" $pre --exclude-drafts --limit 50 \
                --json tagName --jq '.[].tagName'); do
              if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$1" --dir web/models 2>/dev/null; then
                echo "$1 from $tag"; return 0
              fi
            done
            return 1
          }
          if fetch keipilot.onnx; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no release has keipilot.onnx yet; not deploying"
          fi
          fetch keipilot_mc.onnx || echo "::warning::no release has keipilot_mc.onnx yet; the site has no ?pilot=mc"
          fetch keipilot_mc_depth.onnx pre || echo "::warning::no release has keipilot_mc_depth.onnx; the site has no ?recon=model"
          fetch reconfill_gen.onnx pre || echo "::warning::no release has reconfill_gen.onnx; the site has no &fill=model"
      - name: Site
        if: steps.model.outputs.ok == '1'
        run: |
          mkdir _site
          cp -r web/index.html web/src web/vendor web/towns web/models _site/
          du -sh _site
      - if: steps.model.outputs.ok == '1'
        uses: actions/configure-pages@v5
      - if: steps.model.outputs.ok == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        if: steps.model.outputs.ok == '1'
        uses: actions/deploy-pages@v4
