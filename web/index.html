<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KeiView</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@700&family=Zen+Maru+Gothic:wght@500;700;900&family=Yusei+Magic&family=Yuji+Syuku&display=swap">
<!-- Styling adapted from Sakuragaoka Station's index.html (MIT, see vendor/sakuragaoka/LICENSE). -->
<style>
  :root {
    --line: #ef9fbe; --line-deep: #d9718f; --ink: #33304a; --navy: #1f3a68; --paper: #fbf8f2;
    --muted: #6d6a80; --glass: rgba(251, 248, 242, 0.86);
    --round: "Zen Maru Gothic", "Noto Sans JP", "Yu Gothic", "Hiragino Sans", sans-serif;
    --sans: "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Hiragino Sans", sans-serif;
  }
  html, body { height: 100%; margin: 0; background: #cfdcec; color: var(--ink); font-family: var(--sans); overflow: hidden; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* ?pilot=1 (src/pilot.js): 2:1 car camera, the model's path, HUD and its segmentation */
  body.pilot { background: #1d2230; }
  body.pilot canvas#scene { right: auto; bottom: auto; }
  #pilot-overlay { position: fixed; pointer-events: none; z-index: 3; }
  #pilot-hud { position: fixed; left: 12px; top: 12px; z-index: 4; padding: 10px 14px; border-radius: 8px; background: rgba(20, 22, 34, .72);
    color: #fff; font: 500 15px/1.6 var(--sans); }
  #pilot-hud b { font-weight: 700; } #pilot-hud .ep { color: #aab; font-size: 12px; }
  #pilot-hud .keys { margin-top: 4px; color: #aab; font-size: 12px; line-height: 1.5; }
  #pilot-hud .msg { color: #ffc93c; font-size: 13px; min-height: 1.2em; }
  #pilot-hud .traffic { color: #c9cbe0; font-size: 12px; margin-top: 4px; }
  #pilot-hud .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #pilot-hud button { font: 600 13px/1 var(--sans); color: #fff; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .3);
    border-radius: 6px; padding: 8px 10px; cursor: pointer; touch-action: manipulation; }
  #pilot-hud button:hover { background: rgba(255, 255, 255, .22); }
  #pilot-hud button.on { background: #c23aa6; border-color: #ff4fd8; }
  body.pilot #help, body.pilot #cross { display: none; }
  /* ?pilot=1 intro: the driving demo instead of the walk (no walk keys, no start button: it drives by itself) */
  body.pilot-mode #intro .keys, body.pilot-mode #go { display: none; }
  .pilot-about, #townsum.roma:has(p) { text-align: left; letter-spacing: 0; color: var(--ink); font: 500 clamp(12px, 1.7vw, 14px)/1.75 var(--sans); }
  #townsum p { margin: 0 0 6px; } #townsum ul { margin: 0; padding-left: 1.2em; color: var(--muted); }
  #townsum code { font: 600 12px var(--sans); background: rgba(51,48,74,.08); padding: 1px 4px; border-radius: 4px; }
  #pilot-side { position: fixed; right: 12px; bottom: 12px; z-index: 4; display: flex; gap: 10px; align-items: flex-end; }
  #pilot-side figure { margin: 0; }
  #pilot-side canvas { display: block; width: 220px; height: 110px; image-rendering: pixelated; border-radius: 6px;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, .6); }
  #pilot-side figcaption { margin-top: 4px; color: #c9cbe0; font: 500 11px/1.4 var(--sans); text-align: center; }
  @media (max-width: 760px) {
    #pilot-hud { font-size: 13px; padding: 8px 10px; }
    body.pilot #pilot-hud { top: calc(60px + env(safe-area-inset-top, 0px)); }             /* below the clock and the town / quality menus */
    #pilot-hud .keys { display: none; }
    #pilot-side canvas { width: 128px; height: 64px; }
  }

  #intro { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 5;
    background: radial-gradient(120% 90% at 70% 10%, #fdf1f4 0%, #e6eef8 55%, #cfdcec 100%); transition: opacity .9s ease, visibility .9s; }
  body.loaded #intro { background: linear-gradient(180deg, rgba(230,238,248,.35), rgba(207,220,236,.55)); backdrop-filter: blur(2px); }
  body.playing #intro { opacity: 0; visibility: hidden; }
  .board { width: min(720px, 100%); background: var(--paper); border-radius: 10px; box-shadow: 0 18px 50px rgba(51,48,74,.18), 0 0 0 1px rgba(51,48,74,.08);
    padding: 24px clamp(16px, 4vw, 32px) 20px; display: grid; gap: 14px; }
  .kana { text-align: center; font: 700 clamp(14px, 2.2vw, 18px)/1 var(--round); letter-spacing: .5em; color: var(--muted); padding-left: .5em; }
  .name { text-align: center; font: 900 clamp(48px, 11vw, 92px)/1 var(--round); color: var(--navy); letter-spacing: .06em; }
  .no { display: inline-grid; place-items: center; min-width: 2.1em; min-height: 1.9em; padding: .2em .4em; border-radius: 6px; border: 3px solid var(--line-deep); color: var(--navy);
    font: 900 12px/1.1 var(--sans); letter-spacing: .02em; vertical-align: middle; margin-right: .5em; text-align: center; }
  .stripe { position: relative; height: 12px; border-radius: 6px; background: #eadfe3; overflow: hidden; }
  .stripe #bar { position: absolute; inset: 0; background: linear-gradient(90deg, var(--line), var(--line-deep)); transform-origin: left; transform: scaleX(0); transition: transform .35s ease; }
  body.loaded .stripe #bar { transform: scaleX(1); }
  .roma { text-align: center; font: 500 clamp(12px, 1.9vw, 15px)/1.4 var(--sans); letter-spacing: .12em; color: var(--muted); }
  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; border-top: 1px dashed rgba(51,48,74,.18); }
  #loadlabel { font: 500 13px/1.4 var(--sans); color: var(--muted); min-height: 1.4em; max-width: 60ch; }
  body.loaded #loadlabel::before { content: "Ready · KeiSim town, spring afternoon"; }
  #go { font: 700 16px/1 var(--round); color: #fff; background: var(--navy); border: 0; border-radius: 999px; padding: 13px 22px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(31,58,104,.28); opacity: .35; transition: opacity .3s, transform .15s; }
  #go:enabled { opacity: 1; }
  #go:enabled:hover { transform: translateY(-1px); }
  #go:focus-visible, .chip:focus-visible, select:focus-visible { outline: 3px solid var(--line-deep); outline-offset: 2px; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 12px/1.6 var(--sans); color: var(--muted); }
  kbd { font: 700 11px/1 var(--sans); background: #fff; border: 1px solid rgba(51,48,74,.2); border-bottom-width: 2px; border-radius: 4px; padding: 3px 5px; color: var(--ink); }

  .hud { position: fixed; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .6s; }
  body.playing .hud { opacity: 1; }
  body.noui .hud, body.shot .hud, body.shot #intro { display: none !important; }
  #corner { top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  #clock { font: 700 15px/1 var(--round); color: var(--navy); background: var(--glass); border-radius: 999px; padding: 8px 12px; font-variant-numeric: tabular-nums; }
  .chip, select { font: 500 12px/1 var(--sans); color: var(--ink); background: var(--glass); border: 0; border-radius: 999px; padding: 8px 11px; cursor: pointer; }
  #help { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 16px; font: 500 12px/1.7 var(--sans); color: var(--ink);
    background: var(--glass); border-radius: 8px; padding: 8px 12px; max-width: calc(100vw - 32px); }
  body.locked #help { opacity: .55; }
  #cross { top: 50%; left: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(51,48,74,.35); }
  #stats { position: fixed; bottom: 12px; right: 12px; z-index: 4; font: 500 11px/1 var(--sans); background: rgba(51,48,74,.7); color: #fff; padding: 6px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  @media (pointer: coarse) { #help .desk { display: none; } }
  @media (pointer: fine) { #help .touch { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 520px) { .keys { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="KeiSim town 3D view"></canvas>

<div id="intro">
  <div class="board" role="dialog" aria-labelledby="townname">
    <div class="kana">けいしむ · まちあるき</div>
    <div class="name"><span class="no">KeiSim<br>town</span><span id="townname">…</span></div>
    <div class="stripe" aria-hidden="true"><div id="bar"></div></div>
    <div class="roma" id="townsum">procedural KeiSim town × Sakuragaoka-style cel shading</div>
    <div class="foot">
      <div>
        <div id="loadlabel">Loading…</div>
        <div class="keys"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Walk</span><span>Mouse Look</span><span><kbd>Shift</kbd> Run</span><span><kbd>F</kbd> Fly</span><span><kbd>1</kbd>–<kbd>5</kbd> Places</span></div>
      </div>
      <button id="go" disabled>散策をはじめる · Start walking</button>
    </div>
  </div>
</div>

<div class="hud" id="corner">
  <span id="clock">16:02</span>
  <select id="townsel" aria-label="KeiSim town"><option value="1000">town 1000</option><option value="1001">town 1001</option><option value="1002">town 1002</option><option value="1003">town 1003</option></select>
  <select id="quality" aria-label="Graphics quality"><option value="high">Quality: High</option><option value="medium">Quality: Medium</option><option value="low">Quality: Low</option></select>
</div>
<div class="hud" id="help">
  <span class="desk"><kbd>WASD</kbd> Walk · <kbd>Shift</kbd> Run · <kbd>Space</kbd> Jump · <kbd>F</kbd> Fly · <kbd>1</kbd>–<kbd>5</kbd> Places · <kbd>R</kbd> Reset · <kbd>H</kbd> Hide UI</span>
  <span class="touch">Drag left side to walk · drag right side to look</span>
</div>
<div class="hud" id="cross"></div>
<div id="stats" hidden></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
